<VirtualHost *:8080>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/100_rs/htdocs

    <Directory /var/www/100_rs/htdocs>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stdout
    CustomLog /dev/stdout combined
</VirtualHost>
